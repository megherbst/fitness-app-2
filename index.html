<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fitness">
  <meta name="theme-color" content="#0f1117">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>10-Week Fitness Plan</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117;
      --surface: #181c26;
      --surface2: #1e2333;
      --border: #2a2f42;
      --text: #eeedf0;
      --muted: #7b7f94;
      --blue: #2a78d6;
      --blue-dim: #1a3d6b;
      --green: #1baf7a;
      --green-dim: #0d4a33;
      --amber: #eda100;
      --amber-dim: #5a3e00;
      --red: #e05c5c;
      --red-dim: #4a1a1a;
      --purple: #9b6fd4;
      --purple-dim: #2e1a4a;
      --radius: 14px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
    .app { display: flex; flex-direction: column; height: 100%; max-width: 480px; margin: 0 auto; }

    /* HEADER */
    .header { padding: calc(var(--safe-top) + 16px) 20px 14px; background: var(--bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .app-title { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .week-nav { display: flex; align-items: center; gap: 16px; }
    .nav-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); font-size: 16px; transition: background 0.15s; -webkit-tap-highlight-color: transparent; }
    .nav-btn:active { background: var(--border); }
    .nav-btn:disabled { opacity: 0.3; cursor: default; }
    .week-info { text-align: center; }
    .week-num { font-size: 22px; font-weight: 700; line-height: 1; color: var(--text); }
    .week-phase { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .progress-row { display: flex; align-items: center; gap: 10px; }
    .progress-track { flex: 1; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 3px; background: var(--green); transition: width 0.3s ease; }
    .progress-label { font-size: 12px; color: var(--muted); min-width: 52px; text-align: right; }

    /* TABS */
    .tabs { display: flex; background: var(--bg); border-bottom: 1px solid var(--border); padding: 0 20px; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { padding: 10px 14px; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; -webkit-tap-highlight-color: transparent; transition: color 0.15s; }
    .tab.active { color: var(--green); border-bottom-color: var(--green); }

    /* SCROLL */
    .scroll { flex: 1; overflow-y: auto; padding: 16px 16px calc(var(--safe-bottom) + 24px); -webkit-overflow-scrolling: touch; }

    /* DAY CARDS */
    .day-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
    .day-card.rest { background: var(--bg); }
    .day-card.rest-full { background: var(--bg); border-color: var(--border); }
    .day-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 10px; border-bottom: 1px solid var(--border); }
    .day-card.rest .day-header, .day-card.rest-full .day-header { border-bottom: none; padding-bottom: 12px; }
    .day-left { display: flex; align-items: center; gap: 8px; }
    .day-name { font-size: 15px; font-weight: 600; color: var(--text); }
    .day-tag { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; letter-spacing: 0.04em; }
    .tag-hiit { background: var(--red-dim); color: #f09090; }
    .tag-z2 { background: var(--green-dim); color: #5ddfaa; }
    .tag-rest { background: var(--surface2); color: var(--muted); }
    .day-mins { font-size: 12px; color: var(--muted); }
    .workouts { padding: 8px 0 4px; }
    .workout-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .workout-item:active { background: var(--surface2); }
    .check-circle { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .check-circle.done { background: var(--green); border-color: var(--green); }
    .check-circle.done::after { content: ''; width: 6px; height: 10px; border: 2px solid #fff; border-top: none; border-left: none; transform: rotate(45deg) translateY(-1px); display: block; }
    .workout-text { flex: 1; }
    .workout-name { font-size: 14px; color: var(--text); transition: color 0.2s; }
    .workout-name.done { color: var(--muted); text-decoration: line-through; }
    .workout-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .workout-badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
    .badge-cardio { background: var(--green-dim); color: #5ddfaa; }
    .badge-hiit { background: var(--red-dim); color: #f09090; }
    .badge-strength { background: var(--blue-dim); color: #7ab8f5; }
    .rest-label { padding: 12px 16px; font-size: 14px; color: var(--muted); }
    .complete-banner { background: var(--green-dim); border: 1px solid var(--green); border-radius: var(--radius); padding: 14px 16px; text-align: center; font-size: 14px; font-weight: 600; color: var(--green); margin-bottom: 10px; display: none; }

    /* OVERVIEW */
    .ov-phase { margin-bottom: 20px; }
    .ov-phase-title { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; padding: 0 4px; }
    .ov-weeks { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .ov-week { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 6px; text-align: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .ov-week.current { border-color: var(--green); }
    .ov-week.complete { border-color: var(--green); background: var(--green-dim); }
    .ov-week-num { font-size: 15px; font-weight: 700; color: var(--text); line-height: 1; margin-bottom: 4px; }
    .ov-week-pct { font-size: 10px; color: var(--muted); }
    .ov-week.complete .ov-week-pct { color: var(--green); }
    .ov-mini-bar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 6px; }
    .ov-mini-fill { height: 100%; background: var(--green); border-radius: 2px; }

    /* SPLIT / INFO */
    .split-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 10px; }
    .split-row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .split-row:last-child { border-bottom: none; }
    .split-day-pill { background: var(--surface2); border-radius: 8px; padding: 4px 10px; font-size: 12px; font-weight: 700; color: var(--muted); min-width: 38px; text-align: center; }
    .split-focus { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .split-muscles { font-size: 11px; color: var(--muted); }
    .info-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
    .info-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .info-row { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; border-bottom: 1px solid var(--border); }
    .info-row:last-child { border-bottom: none; }
    .info-key { font-size: 13px; color: var(--muted); }
    .info-val { font-size: 13px; font-weight: 600; color: var(--text); }
    .info-val.green { color: var(--green); }
    .info-val.blue { color: var(--blue); }
    .info-val.red { color: var(--red); }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <span class="app-title">Fitness Plan</span>
      <div class="week-nav">
        <button class="nav-btn" id="prev-btn" onclick="changeWeek(-1)">&#8592;</button>
        <div class="week-info">
          <div class="week-num" id="week-num-label">W1</div>
          <div class="week-phase" id="week-phase-label"></div>
        </div>
        <button class="nav-btn" id="next-btn" onclick="changeWeek(1)">&#8594;</button>
      </div>
    </div>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
      <div class="progress-label" id="prog-label">0 / 0</div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="setTab('week',this)">This Week</div>
    <div class="tab" onclick="setTab('overview',this)">Overview</div>
    <div class="tab" onclick="setTab('split',this)">Guide</div>
  </div>

  <div class="scroll" id="main-content"></div>
</div>

<script>
// Each day: {d, cardio: {type, min, note}, strength: {focus, min} | null, rest: bool}
// cardio types: 'z2', 'hiit', null
// Weeks are plan weeks 3-12 compressed to your weeks 1-10

const PLAN = [
  // YOUR WEEK 1 = PLAN WEEK 3 (Foundation)
  { w:1, planW:3, phase:1, name:"Foundation", deload:false, days:[
    { d:"Mon", cardio:{type:"z2",min:25,note:"Easy pace, conversational"}, strength:{focus:"Push",min:15} },
    { d:"Tue", cardio:{type:"hiit",min:25,note:"Climb ride or intervals"}, strength:{focus:"Pull",min:15} },
    { d:"Wed", cardio:{type:"z2",min:25,note:"Easy pace"}, strength:{focus:"Legs",min:15} },
    { d:"Thu", cardio:{type:"z2",min:25,note:"Easy pace"}, strength:{focus:"Push",min:15} },
    { d:"Fri", cardio:{type:"z2",min:25,note:"Easy pace"}, strength:{focus:"Pull",min:15} },
    { d:"Sat", cardio:{type:"z2",min:35,note:"Longer easy ride"}, strength:null },
    { d:"Sun", cardio:null, strength:null, rest:true },
  ]},
  // YOUR WEEK 2 = PLAN WEEK 4 (Foundation)
  { w:2, planW:4, phase:1, name:"Foundation", deload:false, days:[
    { d:"Mon", cardio:{type:"z2",min:30,note:"Easy pace"}, strength:{focus:"Push",min:18} },
    { d:"Tue", cardio:{type:"hiit",min:30,note:"Climb ride or intervals"}, strength:{focus:"Pull",min:18} },
    { d:"Wed", cardio:{type:"z2",min:30,note:"Easy pace"}, strength:{focus:"Legs",min:18} },
    { d:"Thu", cardio:{type:"z2",min:30,note:"Easy pace"}, strength:{focus:"Push",min:18} },
    { d:"Fri", cardio:{type:"z2",min:30,note:"Easy pace"}, strength:{focus:"Pull",min:18} },
    { d:"Sat", cardio:{type:"z2",min:40,note:"Longer easy ride"}, strength:null },
    { d:"Sun", cardio:null, strength:null, rest:true },
  ]},
  // YOUR WEEK 3 = PLAN WEEK 5 (Build)
  { w:3, planW:5, phase:2, name:"Build", deload:false, days:[
    { d:"Mon", cardio:{type:"z2",min:30,note:"Easy pace"}, strength:{focus:"Push",min:20} },
    { d:"Tue", cardio:{type:"hiit",min:35,note:"Climb ride or HIIT"}, strength:{focus:"Pull",min:20} },
    { d:"Wed", cardio:{type:"z2",min:30,note:"Easy pace"}, strength:{focus:"Legs",min:20} },
    { d:"Thu", cardio:{type:"z2",min:30,note:"Easy pace"}, strength:{focus:"Push",min:20} },
    { d:"Fri", cardio:{type:"z2",min:30,note:"Easy pace"}, strength:{focus:"Pull",min:20} },
    { d:"Sat", cardio:{type:"z2",min:45,note:"Longer easy ride"}, strength:null },
    { d:"Sun", cardio:null, strength:null, rest:true },
  ]},
  // YOUR WEEK 4 = PLAN WEEK 6 (Build)
  { w:4, planW:6, phase:2, name:"Build", deload:false, days:[
    { d:"Mon", cardio:{type:"z2",min:30,note:"Easy pace"}, strength:{focus:"Push",min:22} },
    { d:"Tue", cardio:{type:"hiit",min:35,note:"Climb ride or HIIT"}, strength:{focus:"Pull",min:22} },
    { d:"Wed", cardio:{type:"z2",min:32,note:"Easy pace"}, strength:{focus:"Legs",min:22} },
    { d:"Thu", cardio:{type:"z2",min:32,note:"Easy pace"}, strength:{focus:"Push",min:22} },
    { d:"Fri", cardio:{type:"z2",min:32,note:"Easy pace"}, strength:{focus:"Pull",min:22} },
    { d:"Sat", cardio:{type:"z2",min:45,note:"Longer easy ride"}, strength:null },
    { d:"Sun", cardio:null, strength:null, rest:true },
  ]},
  // YOUR WEEK 5 = PLAN WEEK 7 (Build)
  { w:5, planW:7, phase:2, name:"Build", deload:false, days:[
    { d:"Mon", cardio:{type:"z2",min:32,note:"Easy pace"}, strength:{focus:"Push",min:24} },
    { d:"Tue", cardio:{type:"hiit",min:40,note:"Climb ride or HIIT"}, strength:{focus:"Pull",min:24} },
    { d:"Wed", cardio:{type:"z2",min:32,note:"Easy pace"}, strength:{focus:"Legs",min:24} },
    { d:"Thu", cardio:{type:"z2",min:32,note:"Easy pace"}, strength:{focus:"Push",min:24} },
    { d:"Fri", cardio:{type:"z2",min:32,note:"Easy pace"}, strength:{focus:"Pull",min:24} },
    { d:"Sat", cardio:{type:"z2",min:50,note:"Longer easy ride"}, strength:null },
    { d:"Sun", cardio:null, strength:null, rest:true },
  ]},
  // YOUR WEEK 6 = PLAN WEEK 8 (Deload)
  { w:6, planW:8, phase:2, name:"Build", deload:true, days:[
    { d:"Mon", cardio:{type:"z2",min:25,note:"Easy pace — deload"}, strength:{focus:"Push",min:15} },
    { d:"Tue", cardio:{type:"z2",min:25,note:"Skip HIIT this week"}, strength:{focus:"Pull",min:15} },
    { d:"Wed", cardio:{type:"z2",min:25,note:"Easy pace"}, strength:{focus:"Legs",min:15} },
    { d:"Thu", cardio:{type:"z2",min:25,note:"Easy pace"}, strength:{focus:"Push",min:15} },
    { d:"Fri", cardio:{type:"z2",min:25,note:"Easy pace"}, strength:{focus:"Pull",min:15} },
    { d:"Sat", cardio:{type:"z2",min:35,note:"Easy, shorter than usual"}, strength:null },
    { d:"Sun", cardio:null, strength:null, rest:true },
  ]},
  // YOUR WEEK 7 = PLAN WEEK 9 (Consolidate)
  { w:7, planW:9, phase:3, name:"Consolidate", deload:false, days:[
    { d:"Mon", cardio:{type:"z2",min:32,note:"Easy pace"}, strength:{focus:"Push",min:25} },
    { d:"Tue", cardio:{type:"hiit",min:40,note:"Climb ride or HIIT"}, strength:{focus:"Pull",min:25} },
    { d:"Wed", cardio:{type:"z2",min:32,note:"Easy pace"}, strength:{focus:"Legs",min:25} },
    { d:"Thu", cardio:{type:"z2",min:32,note:"Easy pace"}, strength:{focus:"Push",min:25} },
    { d:"Fri", cardio:{type:"z2",min:32,note:"Easy pace"}, strength:{focus:"Pull",min:25} },
    { d:"Sat", cardio:{type:"z2",min:50,note:"Longer easy ride"}, strength:null },
    { d:"Sun", cardio:null, strength:null, rest:true },
  ]},
  // YOUR WEEK 8 = PLAN WEEK 10
  { w:8, planW:10, phase:3, name:"Consolidate", deload:false, days:[
    { d:"Mon", cardio:{type:"z2",min:36,note:"Easy pace"}, strength:{focus:"Push",min:25} },
    { d:"Tue", cardio:{type:"hiit",min:40,note:"Climb ride or HIIT"}, strength:{focus:"Pull",min:25} },
    { d:"Wed", cardio:{type:"z2",min:36,note:"Easy pace"}, strength:{focus:"Legs",min:25} },
    { d:"Thu", cardio:{type:"z2",min:36,note:"Easy pace"}, strength:{focus:"Push",min:25} },
    { d:"Fri", cardio:{type:"z2",min:36,note:"Easy pace"}, strength:{focus:"Pull",min:25} },
    { d:"Sat", cardio:{type:"z2",min:55,note:"Longer easy ride"}, strength:null },
    { d:"Sun", cardio:null, strength:null, rest:true },
  ]},
  // YOUR WEEK 9 = PLAN WEEK 11
  { w:9, planW:11, phase:3, name:"Consolidate", deload:false, days:[
    { d:"Mon", cardio:{type:"z2",min:40,note:"Easy pace"}, strength:{focus:"Push",min:25} },
    { d:"Tue", cardio:{type:"hiit",min:45,note:"Climb ride or HIIT"}, strength:{focus:"Pull",min:25} },
    { d:"Wed", cardio:{type:"z2",min:40,note:"Easy pace"}, strength:{focus:"Legs",min:25} },
    { d:"Thu", cardio:{type:"z2",min:40,note:"Easy pace"}, strength:{focus:"Push",min:25} },
    { d:"Fri", cardio:{type:"z2",min:40,note:"Easy pace"}, strength:{focus:"Pull",min:25} },
    { d:"Sat", cardio:{type:"z2",min:60,note:"Longer easy ride"}, strength:null },
    { d:"Sun", cardio:null, strength:null, rest:true },
  ]},
  // YOUR WEEK 10 = PLAN WEEK 12
  { w:10, planW:12, phase:3, name:"Consolidate", deload:false, days:[
    { d:"Mon", cardio:{type:"z2",min:45,note:"Easy pace"}, strength:{focus:"Push",min:25} },
    { d:"Tue", cardio:{type:"hiit",min:45,note:"Climb ride or HIIT"}, strength:{focus:"Pull",min:25} },
    { d:"Wed", cardio:{type:"z2",min:45,note:"Easy pace"}, strength:{focus:"Legs",min:25} },
    { d:"Thu", cardio:{type:"z2",min:45,note:"Easy pace"}, strength:{focus:"Push",min:25} },
    { d:"Fri", cardio:{type:"z2",min:45,note:"Easy pace"}, strength:{focus:"Pull",min:25} },
    { d:"Sat", cardio:{type:"z2",min:60,note:"Longer easy ride"}, strength:null },
    { d:"Sun", cardio:null, strength:null, rest:true },
  ]},
];

const PHASE_LABELS = {1:"Phase 1: Foundation", 2:"Phase 2: Build", 3:"Phase 3: Consolidate"};

let currentWeek = 0;
let currentTab = 'week';
let checked = {};

function load() {
  try { checked = JSON.parse(localStorage.getItem('fitness_v2_checked') || '{}'); } catch(e) { checked={}; }
  currentWeek = parseInt(localStorage.getItem('fitness_v2_week') || '0');
}

function save() {
  localStorage.setItem('fitness_v2_checked', JSON.stringify(checked));
  localStorage.setItem('fitness_v2_week', currentWeek);
}

function key(w, d, id) { return `${w}_${d}_${id}`; }
function isDone(w, d, id) { return !!checked[key(w,d,id)]; }

function toggle(w, d, id) {
  const k = key(w,d,id);
  checked[k] = !checked[k];
  save();
  renderTab();
}

function getItems(day) {
  // Returns list of {id, label, sub, type} for a day
  const items = [];
  if(day.cardio) {
    const label = day.cardio.type === 'hiit' ? 'Peloton — harder effort' : 'Peloton — Zone 2';
    items.push({id:'cardio', label, sub: day.cardio.note, type: day.cardio.type === 'hiit' ? 'hiit' : 'cardio', min: day.cardio.min});
  }
  if(day.strength) {
    items.push({id:'strength', label: `Strength — ${day.strength.focus}`, sub: strengthMuscles(day.strength.focus), type:'strength', min: day.strength.min});
  }
  return items;
}

function strengthMuscles(focus) {
  if(focus === 'Push') return 'Chest, shoulders, triceps';
  if(focus === 'Pull') return 'Back, biceps';
  if(focus === 'Legs') return 'Quads, glutes, hamstrings, core';
  return '';
}

function weekProgress(wi) {
  const week = PLAN[wi];
  let total = 0, done = 0;
  week.days.forEach((day, di) => {
    getItems(day).forEach(item => {
      total++;
      if(isDone(week.w, di, item.id)) done++;
    });
  });
  return {total, done, pct: total > 0 ? Math.round(done/total*100) : 0};
}

function changeWeek(delta) {
  currentWeek = Math.max(0, Math.min(9, currentWeek + delta));
  save();
  renderTab();
}

function setTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderTab();
}

function renderHeader() {
  const week = PLAN[currentWeek];
  document.getElementById('week-num-label').textContent = 'W' + week.w;
  document.getElementById('week-phase-label').textContent = PHASE_LABELS[week.phase] + (week.deload ? ' · Deload' : '');
  document.getElementById('prev-btn').disabled = currentWeek === 0;
  document.getElementById('next-btn').disabled = currentWeek === 9;
  const {total, done, pct} = weekProgress(currentWeek);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = done + ' / ' + total;
}

function renderTab() {
  renderHeader();
  if(currentTab === 'week') renderWeekTab();
  else if(currentTab === 'overview') renderOverviewTab();
  else renderGuideTab();
}

function renderWeekTab() {
  const week = PLAN[currentWeek];
  const {total, done} = weekProgress(currentWeek);
  let html = '';

  if(total > 0 && done === total) {
    html += `<div class="complete-banner" style="display:block">&#10003; Week ${week.w} complete!</div>`;
  }

  week.days.forEach((day, di) => {
    const items = getItems(day);
    const isFullRest = day.rest;
    const isSatOnly = items.length === 1 && items[0].id === 'cardio' && !day.strength;

    html += `<div class="day-card${isFullRest ? ' rest-full' : (items.length === 0 ? ' rest' : '')}">`;

    // Header
    const isHiit = day.cardio && day.cardio.type === 'hiit';
    const totalMins = items.reduce((s,i) => s + i.min, 0);
    html += `<div class="day-header">
      <div class="day-left">
        <span class="day-name">${day.d}</span>
        ${isFullRest ? `<span class="day-tag tag-rest">REST</span>` : isHiit ? `<span class="day-tag tag-hiit">EFFORT</span>` : `<span class="day-tag tag-z2">ZONE 2</span>`}
      </div>
      ${!isFullRest && totalMins > 0 ? `<span class="day-mins">${totalMins} min</span>` : ''}
    </div>`;

    if(isFullRest) {
      html += `<div class="rest-label">Full rest — no training today</div>`;
    } else {
      html += `<div class="workouts">`;
      items.forEach(item => {
        const done = isDone(week.w, di, item.id);
        const badgeClass = item.type === 'hiit' ? 'badge-hiit' : item.type === 'cardio' ? 'badge-cardio' : 'badge-strength';
        html += `<div class="workout-item" onclick="toggle(${week.w},${di},'${item.id}')">
          <div class="check-circle${done ? ' done' : ''}"></div>
          <div class="workout-text">
            <div class="workout-name${done ? ' done' : ''}">${item.label}</div>
            ${item.sub ? `<div class="workout-sub">${item.sub}</div>` : ''}
          </div>
          <span class="workout-badge ${badgeClass}">${item.min} min</span>
        </div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  });

  document.getElementById('main-content').innerHTML = html;
}

function renderOverviewTab() {
  const phases = [
    {label:"Phase 1 — Foundation", weeks:[0,1]},
    {label:"Phase 2 — Build", weeks:[2,3,4,5]},
    {label:"Phase 3 — Consolidate", weeks:[6,7,8,9]},
  ];
  let html = '';
  phases.forEach(phase => {
    html += `<div class="ov-phase"><div class="ov-phase-title">${phase.label}</div><div class="ov-weeks">`;
    phase.weeks.forEach(wi => {
      const week = PLAN[wi];
      const {pct} = weekProgress(wi);
      const isCurrent = wi === currentWeek;
      const isComplete = pct === 100;
      html += `<div class="ov-week${isCurrent?' current':''}${isComplete?' complete':''}"
        onclick="currentWeek=${wi};save();document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===0));setTab('week',document.querySelectorAll('.tab')[0])">
        <div class="ov-week-num">W${week.w}</div>
        <div class="ov-week-pct">${isComplete ? '&#10003; Done' : pct+'%'}${week.deload?' D':''}</div>
        <div class="ov-mini-bar"><div class="ov-mini-fill" style="width:${pct}%"></div></div>
      </div>`;
    });
    html += `</div></div>`;
  });
  document.getElementById('main-content').innerHTML = html;
}

function renderGuideTab() {
  const split = [
    {d:"Mon", focus:"Push", color:"color:var(--green)", muscles:"Chest, shoulders, triceps", cardio:"Zone 2"},
    {d:"Tue", focus:"Pull", color:"color:var(--green)", muscles:"Back, biceps", cardio:"Harder effort (HIIT / climb)"},
    {d:"Wed", focus:"Legs", color:"color:var(--green)", muscles:"Quads, glutes, hamstrings, core", cardio:"Zone 2"},
    {d:"Thu", focus:"Push", color:"color:var(--green)", muscles:"Chest, shoulders, triceps", cardio:"Zone 2"},
    {d:"Fri", focus:"Pull", color:"color:var(--green)", muscles:"Back, biceps", cardio:"Zone 2"},
    {d:"Sat", focus:"—", color:"color:var(--muted)", muscles:"No strength", cardio:"Zone 2 — longer easy ride"},
    {d:"Sun", focus:"Rest", color:"color:var(--muted)", muscles:"Full rest day", cardio:"No training"},
  ];

  let html = `<div class="split-card">`;
  split.forEach(row => {
    html += `<div class="split-row">
      <div class="split-day-pill">${row.d}</div>
      <div style="flex:1">
        <div class="split-focus" style="${row.color}">${row.focus}</div>
        <div class="split-muscles">${row.muscles}</div>
        <div style="font-size:11px;color:var(--blue);margin-top:2px">${row.cardio}</div>
      </div>
    </div>`;
  });
  html += `</div>`;

  html += `<div class="info-card">
    <div class="info-label">Cardio zones</div>
    <div class="info-row"><span class="info-key">Zone 2</span><span class="info-val green">60–70% max HR · conversational</span></div>
    <div class="info-row"><span class="info-key">Harder effort (Tue)</span><span class="info-val red">HIIT ride, climb, or tempo · 30–45 min</span></div>
    <div class="info-row"><span class="info-key">Deload (week 6)</span><span class="info-val">All Zone 2 · skip HIIT</span></div>
  </div>`;

  html += `<div class="info-card">
    <div class="info-label">Week 10 targets</div>
    <div class="info-row"><span class="info-key">Aerobic</span><span class="info-val blue">35–43 MET-hrs/wk</span></div>
    <div class="info-row"><span class="info-key">Resistance</span><span class="info-val green">125 min/wk</span></div>
    <div class="info-row"><span class="info-key">Weights</span><span class="info-val">3, 5, 8 lb dumbbells + bench</span></div>
    <div class="info-row"><span class="info-key">Rest</span><span class="info-val">Sunday — full rest</span></div>
  </div>`;

  html += `<div class="info-card">
    <div class="info-label">Glucose notes (T1D)</div>
    <div class="info-row"><span class="info-key">Zone 2</span><span class="info-val green">Tends to lower glucose steadily</span></div>
    <div class="info-row"><span class="info-key">HIIT (Tue)</span><span class="info-val">May raise glucose short-term</span></div>
    <div class="info-row"><span class="info-key">Strength</span><span class="info-val">Delayed drop — watch post-session</span></div>
    <div class="info-row"><span class="info-key">Tip</span><span class="info-val">Check Dexcom pattern on Tue specifically</span></div>
  </div>`;

  document.getElementById('main-content').innerHTML = html;
}

if('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}

load();
renderTab();
</script>
</body>
</html>
